# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Coordinates. JitPack serves the modules as com.github.OpenModularTurretsTeam.OpenModularCore:<module>:<tag> and
# builds with -Pversion=<tag> (jitpack.yml); a local build is 0.0.0-SNAPSHOT. The workspaces' includeBuild matches
# this group, so it must stay the JitPack group.
group=com.github.OpenModularTurretsTeam.OpenModularCore
version=0.0.0-SNAPSHOT

# The core is written for Java 17 (the oldest modern target, 1.20.1); the -j8 modules are downgraded to Java 8
java_version=17
java8_version=8

# Tests: JUnit 5 and EqualsVerifier 3, because the same tests also run on Java 8 (JUnit 6 and EqualsVerifier 4 need 17)
junit_version=5.13.4
equalsverifier_version=3.19.4
# Architecture rules as unit tests (test only), the same version as in the mods
archunit_version=1.5.1
# Test coverage (printed by check) and mutation testing (./gradlew pitest, on demand), the same versions as in the mods
jacoco_version=0.8.15
pitest_version=1.30.0
pitest_junit5_version=1.2.3
