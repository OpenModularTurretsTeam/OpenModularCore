# The mod whose core this is: the classes are in <base_package>.core, the Java 8 API stubs in <base_package>/jvmdg/
base_package=omtteam.openmodularturrets
# Thresholds of the pitest task (PIT rounds the percentages), taken over from OpenModularTurrets (the state of
# 2026-11-06): it fails when fewer mutations are detected, less is covered or more are not detected than here.
# Lower pitest_max_surviving when a test kills one; raise it only for a survivor that no test can notice.
pitest_mutation_threshold=99
pitest_coverage_threshold=98
pitest_max_surviving=8
