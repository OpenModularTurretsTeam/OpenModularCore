# The mod whose core this is: the classes are in <base_package>.core, the Java 8 API stubs in <base_package>/jvmdg/
base_package=omtteam.omlib
# Thresholds of the pitest task (PIT rounds the percentages), measured on the core alone on 2026-11-18 (OMLib's own
# thresholds also cover its config and network code): it fails when fewer mutations are detected, less is covered or
# more are not detected than here. Lower pitest_max_surviving when a test kills one; raise it only for a survivor that
# no test can notice.
# Measured again on 2026-11-18 after the reconcile with 1.12: 223 of 225 mutations detected (the two FloodFill
# survivors), 256 of 258 lines covered. The 2 uncovered lines are the private constructor of FloodFill; the one of
# CamoPermissions (moved here from omt-core) is called through reflection in CamoPermissionsTest.
# With MachineMode and TargetingSettings moved here from omt-core (decided by the user, 2026-11-18): one more survivor,
# the boundary mutant of `range > this.maxRange` in TargetingSettings.setMaxRange, which is equivalent (at equality
# the assignment changes nothing), so no test can notice it.
pitest_mutation_threshold=99
pitest_coverage_threshold=99
pitest_max_surviving=3
